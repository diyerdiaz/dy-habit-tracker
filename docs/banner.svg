<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DY Habit Tracker &amp; English">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0612"/>
      <stop offset="100%" stop-color="#150a24"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="orbPurple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPink" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="55%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <circle cx="90" cy="55" r="34" fill="url(#orbPurple)" opacity="0.85"/>
  <circle cx="1120" cy="70" r="26" fill="url(#orbPink)" opacity="0.8"/>
  <circle cx="1050" cy="190" r="40" fill="url(#orbPurple)" opacity="0.7"/>
  <circle cx="60" cy="205" r="22" fill="url(#orbBlue)" opacity="0.75"/>
  <circle cx="200" cy="220" r="10" fill="url(#orbPink)" opacity="0.7"/>
  <circle cx="960" cy="40" r="12" fill="url(#orbBlue)" opacity="0.6"/>
  <circle cx="330" cy="30" r="8" fill="url(#orbPink)" opacity="0.6"/>

  <text x="600" y="118" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" font-style="italic" font-size="54" fill="url(#title)" filter="url(#glow)">DY Habit Tracker &amp; English</text>

  <text x="600" y="158" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="20" fill="#c4b5fd" opacity="0.9">Hábitos, disciplina y aprendizaje de inglés — con XP, niveles y rachas</text>

  <g font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="15" font-weight="600">
    <g transform="translate(330,195)">
      <rect x="0" y="0" width="108" height="34" rx="17" fill="#1f1030" stroke="#a855f7" stroke-opacity="0.6"/>
      <text x="54" y="22" text-anchor="middle" fill="#e9d5ff">🔥 Hábitos</text>
    </g>
    <g transform="translate(450,195)">
      <rect x="0" y="0" width="118" height="34" rx="17" fill="#1f1030" stroke="#ec4899" stroke-opacity="0.6"/>
      <text x="59" y="22" text-anchor="middle" fill="#fbcfe8">🎮 Gamificación</text>
    </g>
    <g transform="translate(580,195)">
      <rect x="0" y="0" width="94" height="34" rx="17" fill="#1f1030" stroke="#a855f7" stroke-opacity="0.6"/>
      <text x="47" y="22" text-anchor="middle" fill="#e9d5ff">🎡 Castigos</text>
    </g>
    <g transform="translate(686,195)">
      <rect x="0" y="0" width="98" height="34" rx="17" fill="#0e1a33" stroke="#3b82f6" stroke-opacity="0.7"/>
      <text x="49" y="22" text-anchor="middle" fill="#bfdbfe">🌐 Inglés</text>
    </g>
  </g>
</svg>
