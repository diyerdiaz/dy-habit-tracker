services:
  app:
    build: .
    image: mi-proyecto-personal
    container_name: mi-proyecto-personal
    restart: unless-stopped
    # Sin "ports": gunicorn no queda abierto a internet. Coolify llega por su red
    # interna (su Traefik pone el HTTPS) al puerto 4000 del contenedor.
    expose:
      - "4000"
    environment:

      # La app se publica con HTTPS (habits.proyecto.lol): la cookie de sesión solo viaja cifrada
      SESSION_COOKIE_SECURE: "1"
      # Solo hay un proxy delante (Traefik de Coolify): de él se toma la IP real
      PROXIES_DE_CONFIANZA: "1"
      TZ: America/Bogota
      # Correo de los recordatorios. Los valores reales se ponen en Coolify
      # (Environment Variables) o en un .env junto a este archivo; nunca aquí.
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Dirección pública para los botones del correo (Coolify la llena sola)
      APP_URL: ${SERVICE_URL_APP:-}
      # Respaldo continuo en un bucket S3 (Cloudflare R2). Vacías = sin respaldo.
      # Los valores reales se ponen en Coolify (Environment Variables); nunca aquí.
      RESPALDO_BUCKET: ${RESPALDO_BUCKET:-}
      RESPALDO_ENDPOINT: ${RESPALDO_ENDPOINT:-}
      RESPALDO_ACCESS_KEY_ID: ${RESPALDO_ACCESS_KEY_ID:-}
      RESPALDO_SECRET_ACCESS_KEY: ${RESPALDO_SECRET_ACCESS_KEY:-}
      # Administrador que se crea solo al arrancar si todavía no existe (solo ve /admin).
      # Los valores reales se ponen en Coolify (Environment Variables); nunca aquí.
      ADMIN_USUARIO: ${ADMIN_USUARIO:-}
      ADMIN_CONTRASENA: ${ADMIN_CONTRASENA:-}
    volumes:
     
      - ./instance:/app/instance:z
