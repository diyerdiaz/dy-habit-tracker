<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Habits">
  <defs>
    <!-- Fondo oscuro como la app -->
    <radialGradient id="fondo" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#2a0b45"/>
      <stop offset="0.6" stop-color="#12031f"/>
      <stop offset="1" stop-color="#05000a"/>
    </radialGradient>
    <!-- Borde neón (violeta → rosado → azul: hábitos, personajes e inglés) -->
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b2ff7"/>
      <stop offset="0.55" stop-color="#ff6fb5"/>
      <stop offset="1" stop-color="#4dabff"/>
    </linearGradient>
    <!-- La luna de los personajes del login -->
    <radialGradient id="luna" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#f3c6ff"/>
      <stop offset="0.45" stop-color="#d966ff"/>
      <stop offset="0.8" stop-color="#7b2ff7" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7b2ff7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd6f5"/>
    </linearGradient>
    <filter id="aura" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#fondo)"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#borde)" stroke-width="3"/>

  <!-- Luna con su anillo -->
  <circle cx="50" cy="48" r="33" fill="url(#luna)" opacity="0.8"/>
  <circle cx="50" cy="48" r="24" fill="none" stroke="#f3c6ff" stroke-opacity="0.45" stroke-width="1.2"/>

  <!-- El check de los hábitos, con brillo de aura -->
  <path d="M29 51 L44 66 L72 36" fill="none" stroke="#ff6fb5" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" filter="url(#aura)"/>
  <path d="M29 51 L44 66 L72 36" fill="none" stroke="url(#check)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Destello y pétalos de sakura -->
  <polygon points="80,11 81.7,18.3 89,20 81.7,21.7 80,29 78.3,21.7 71,20 78.3,18.3" fill="#fff"/>
  <circle cx="21" cy="24" r="1.6" fill="#fff" opacity="0.85"/>
  <ellipse cx="22" cy="78" rx="4.2" ry="2.1" fill="#ff9ad5" transform="rotate(-28 22 78)"/>
  <ellipse cx="80" cy="80" rx="3.4" ry="1.7" fill="#4dabff" transform="rotate(35 80 80)"/>
</svg>
