<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Samurái anime de frente sujetando su katana brillante en vertical">
  <defs>
    <radialGradient id="luna" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#ffd0d8"/>
      <stop offset="0.45" stop-color="#ff4d6d"/>
      <stop offset="0.8" stop-color="#8b0033" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b0033" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silueta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0533"/>
      <stop offset="1" stop-color="#07000f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fa3"/>
      <stop offset="0.5" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#6a00a8"/>
    </linearGradient>
    <filter id="brillo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Aura de humo: la silueta se engrosa, se deforma con ruido animado y se difumina -->
    <linearGradient id="aura" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="0.45" stop-color="#ff1a40"/>
      <stop offset="1" stop-color="#6a00a8"/>
    </linearGradient>
    <filter id="humo" x="-35%" y="-35%" width="170%" height="170%">
      <feMorphology in="SourceGraphic" operator="dilate" radius="13" result="grueso"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="4" result="ruido">
        <animate attributeName="baseFrequency" dur="8s" values="0.012 0.03;0.018 0.045;0.012 0.03" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="grueso" in2="ruido" scale="60" xChannelSelector="R" yChannelSelector="G" result="ondas">
        <animate attributeName="scale" dur="3.5s" values="45;80;45" repeatCount="indefinite"/>
      </feDisplacementMap>
      <feGaussianBlur in="ondas" stdDeviation="10"/>
    </filter>
    <filter id="humo-fino" x="-35%" y="-35%" width="170%" height="170%">
      <feMorphology in="SourceGraphic" operator="dilate" radius="5" result="grueso"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.07" numOctaves="2" seed="11" result="ruido">
        <animate attributeName="baseFrequency" dur="5s" values="0.03 0.07;0.04 0.09;0.03 0.07" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="grueso" in2="ruido" scale="30" xChannelSelector="R" yChannelSelector="G" result="ondas">
        <animate attributeName="scale" dur="2.6s" values="22;38;22" repeatCount="indefinite"/>
      </feDisplacementMap>
      <feGaussianBlur in="ondas" stdDeviation="3"/>
    </filter>
    <filter id="voluta" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <path id="forma-pelo" d="M184 120 C186 98 196 86 210 84 C222 82 232 90 228 100 C240 94 256 98 262 112 C246 106 234 110 228 118 C220 110 196 110 184 120 Z M208 86 C192 60 160 54 128 62 C150 70 170 78 182 94 Z M160 152 C158 128 176 112 200 112 C224 112 242 128 240 152 C230 138 214 134 200 140 C186 134 170 138 160 152 Z"/>
    <path id="forma-cuerpo" d="M200 112 C222 112 240 130 240 152 C240 172 230 188 214 194 L216 214 C254 220 290 234 300 258 L318 342 L292 352 L284 322 C292 382 312 452 334 520 L66 520 C88 452 108 382 116 322 L108 352 L82 342 L100 258 C110 234 146 220 184 214 L186 194 C170 188 160 172 160 152 C160 130 178 112 200 112 Z"/>
  </defs>

  <!-- Luna -->
  <circle cx="200" cy="170" r="165" fill="url(#luna)" opacity="0.6"/>
  <circle cx="200" cy="170" r="118" fill="none" stroke="#ffd0d8" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Estrellas -->
  <g fill="#fff">
    <circle cx="48" cy="60" r="1.6" opacity="0.8"/>
    <circle cx="352" cy="42" r="1.4" opacity="0.7"/>
    <circle cx="372" cy="150" r="1.8" opacity="0.6"/>
    <circle cx="30" cy="170" r="1.2" opacity="0.6"/>
    <circle cx="330" cy="300" r="1.4" opacity="0.5"/>
    <path d="M86 112 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity="0.85"/>
    <path d="M340 92 l1.5 4.5 4.5 1.5 -4.5 1.5 -1.5 4.5 -1.5 -4.5 -4.5 -1.5 4.5 -1.5z" opacity="0.8"/>
  </g>

  <!-- Aura de humo alrededor del personaje (se mueve sola) -->
  <g opacity="1" filter="url(#humo)" fill="url(#aura)">
    <use href="#forma-pelo"/>
    <use href="#forma-cuerpo"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.95" filter="url(#humo-fino)" fill="#ffb3c1">
    <use href="#forma-pelo"/>
    <use href="#forma-cuerpo"/>
  </g>

  <!-- Volutas de humo que suben desde los bordes -->
  <g filter="url(#voluta)" fill="#ff4d6d">
    <ellipse cx="200" cy="90" rx="24" ry="38">
      <animateTransform attributeName="transform" type="translate" values="0 0;-10 -70" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="290" cy="250" rx="22" ry="36" fill="#ff1a40">
      <animateTransform attributeName="transform" type="translate" values="0 0;14 -80" dur="5s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0" dur="5s" begin="1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="150" cy="255" rx="23" ry="38">
      <animateTransform attributeName="transform" type="translate" values="0 0;-16 -75" dur="4.5s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0" dur="4.5s" begin="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="70" cy="300" rx="20" ry="32" fill="#6a00a8">
      <animateTransform attributeName="transform" type="translate" values="0 0;-12 -60" dur="3.8s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0" dur="3.8s" begin="0.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="300" cy="360" rx="21" ry="34">
      <animateTransform attributeName="transform" type="translate" values="0 0;10 -70" dur="4.2s" begin="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0" dur="4.2s" begin="2.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="248" cy="80" rx="18" ry="30" fill="#ff1a40">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 -60" dur="3.6s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0" dur="3.6s" begin="1.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Cabello -->
  <use href="#forma-pelo" fill="url(#silueta)"/>

  <!-- Cuerpo y cabeza de perfil, mirando hacia el formulario -->
  <use href="#forma-cuerpo" fill="url(#silueta)"/>


  <!-- Contorno neón -->
  <g fill="none" stroke="url(#neon)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" filter="url(#brillo)">
    <use href="#forma-cuerpo"/>
    <use href="#forma-pelo" stroke-opacity="0.8"/>
  </g>

  <!-- Ojo y detalles del personaje -->
  <g fill="#ffd0d8" filter="url(#brillo)">
    <path d="M182 160 q6 -4 12 0 q-6 3 -12 0z"/>
    <path d="M206 160 q6 -4 12 0 q-6 3 -12 0z"/>
  </g>
  <g filter="url(#brillo)">
    <path d="M200 300 L200 46" stroke="#ff4d6d" stroke-width="6" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="1;0.6;1" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M200 300 L200 46" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <ellipse cx="200" cy="304" rx="18" ry="5" fill="#ff4d6d"/>
    <path d="M200 308 L200 360" stroke="#2a0a14" stroke-width="10" stroke-linecap="round"/>
    <path d="M200 308 L200 360" stroke="#ff4d6d" stroke-width="3" stroke-dasharray="6 5"/>
  </g>
  <g fill="#14030a" stroke="#ff4d6d" stroke-width="1.6" stroke-opacity="0.8">
    <path d="M174 318 C180 304 192 300 200 312 C208 300 220 304 226 318 C220 334 180 334 174 318 Z"/>
  </g>
  <path d="M186 214 L200 246 L214 214 M200 246 L200 300" fill="none" stroke="#ff4d6d" stroke-width="1.8" stroke-opacity="0.6"/>

  <!-- Partículas -->
  <g fill="#ff8a5c" filter="url(#brillo)">
    <circle cx="322" cy="210" r="3.2"><animate attributeName="cy" values="230;180" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="96" cy="400" r="2.6"><animate attributeName="cy" values="420;360" dur="3.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="352" cy="360" r="2.4"><animate attributeName="cy" values="380;320" dur="3.2s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="230" r="2.8"><animate attributeName="cy" values="250;190" dur="2.8s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
