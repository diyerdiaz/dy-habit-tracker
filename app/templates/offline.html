<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7b2ff7">
  <title>Sin conexión · Habits</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0012;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 0 30px rgba(var(--tema-vivo-rgb, 193, 60, 255), 0.5); }
    h1 { font-style: italic; color: var(--tema-vivo, #d966ff); margin: 20px 0 8px; }
    p { color: rgba(255, 255, 255, 0.65); margin: 0 0 22px; }
    button {
      border: none; border-radius: 22px; padding: 11px 26px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, var(--tema-grad-1, #7b2ff7), var(--tema-vivo, #c13cff)); cursor: pointer; font-size: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <img src="/static/img/logo.svg" alt="Habits">
    <h1>Sin conexión</h1>
    <p>Revisa tu internet. Tus hábitos te esperan.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
