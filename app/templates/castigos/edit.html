<!-- Modal: Editar Castigo -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg glass-modal">
            <div class="modal-header glass-header">
                <h5 class="modal-title d-flex align-items-center fw-bold">
                    <div class="icon-box"><i class="bi bi-pencil text-warning"></i></div>
                    Editar Castigo
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="editForm" method="POST" action="">
                    <div class="mb-3">
                        <label class="form-label text-white-50">Nombre del Castigo</label>
                        <input type="text" name="castigoName" id="editName" class="form-control glass-input" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white-50">Descripción o Meta</label>
                        <input type="text" name="castigoDesc" id="editDesc" class="form-control glass-input">
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-white-50">Categoría</label>
                        <select name="castigoCategory" id="editCategory" class="form-select glass-input">
                            <option value="salud" style="background: var(--tema-oscuro, #250035);">Salud y Deporte</option>
                            <option value="mente" style="background: var(--tema-oscuro, #250035);">Mente y Educación</option>
                            <option value="finanzas" style="background: var(--tema-oscuro, #250035);">Finanzas</option>
                            <option value="espiritual" style="background: var(--tema-oscuro, #250035);">Espiritual / Social</option>
                        </select>
                    </div>
                    <button type="submit" class="btn w-100 btn-purple fw-bold">Actualizar Castigo</button>
                </form>
            </div>
        </div>
    </div>
</div>
