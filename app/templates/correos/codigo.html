{# Correo HTML: tablas y estilos inline porque Gmail y otros clientes ignoran los .css
   externos y los <style>. Los colores vienen del personaje del login (tema). #}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Tu código para recuperar la contraseña</title>
</head>
<body style="margin:0;padding:0;background:#07000d;" bgcolor="#07000d">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#07000d" style="background:#07000d;">
<tr><td align="center" style="padding:28px 12px;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
    <tr><td align="center" style="padding:0 0 16px;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:{{ tema['vivo'] }};">
      DY Habit Tracker
    </td></tr>

    <tr><td bgcolor="{{ tema['oscuro'] }}" style="background:{{ tema['oscuro'] }};background-image:linear-gradient(180deg, {{ tema['oscuro'] }} 0%, {{ tema['oscuro-2'] }} 100%);border:1px solid rgba({{ tema['vivo-rgb'] }}, 0.35);border-radius:24px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr><td align="center" style="padding:24px 24px 0;">
          <img src="cid:personaje" width="170" alt="{{ personaje['nombre'] }}" style="display:block;width:170px;max-width:100%;height:auto;border:0;">
        </td></tr>

        <tr><td align="center" style="padding:8px 28px 0;font-family:Georgia,'Times New Roman',serif;">
          <h1 style="margin:0;font-size:26px;font-style:italic;font-weight:700;color:{{ tema['vivo'] }};">Recupera tu contraseña</h1>
          <p style="margin:10px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:rgba(255,255,255,0.8);">
            Hola, {{ user.nameUser }}. Escribe este código en la app para crear una contraseña nueva:
          </p>
        </td></tr>

        <tr><td style="padding:22px 28px 0;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:rgba({{ tema['vivo-rgb'] }}, 0.12);border:1px solid rgba({{ tema['vivo-rgb'] }}, 0.45);border-radius:18px;">
            <tr><td align="center" style="padding:20px 12px;font-family:'Courier New',Courier,monospace;font-size:40px;font-weight:700;letter-spacing:12px;color:#ffffff;">
              {{ codigo }}
            </td></tr>
          </table>
        </td></tr>

        <tr><td align="center" style="padding:14px 28px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:{{ tema['vivo'] }};font-weight:700;">
          ⏱ Vence en {{ minutos }} minutos · tienes 3 intentos
        </td></tr>

        <tr><td style="padding:20px 28px 26px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.6;color:rgba(255,255,255,0.6);">
          <p style="margin:0;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,0.05);">
            🔒 Si no pediste este código, ignora este correo: tu contraseña no cambia y tu cuenta sigue segura. Nunca compartas este código con nadie.
          </p>
        </td></tr>
      </table>
    </td></tr>

    <tr><td align="center" style="padding:18px 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:rgba(255,255,255,0.4);">
      Recibes este correo porque alguien pidió recuperar la contraseña de tu cuenta.
    </td></tr>
  </table>

</td></tr>
</table>
</body>
</html>
