{# Correo HTML: tablas y estilos inline porque Gmail y otros clientes ignoran los .css
   externos y los <style>. Mismo estilo que correos/tarea.html. #}
{%- set colores = {'alto': '#00e676', 'medio': '#ffcc66', 'bajo': '#ff6666'} -%}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Tu resumen de {{ resumen.mes }}</title>
</head>
<body style="margin:0;padding:0;background:#07000d;" bgcolor="#07000d">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#07000d" style="background:#07000d;">
<tr><td align="center" style="padding:28px 12px;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
    <tr><td align="center" style="padding:0 0 16px;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:{{ tema['vivo'] }};">
      DY Habit Tracker
    </td></tr>

    <tr><td bgcolor="{{ tema['oscuro'] }}" style="background:{{ tema['oscuro'] }};background-image:linear-gradient(180deg, {{ tema['oscuro'] }} 0%, {{ tema['oscuro-2'] }} 100%);border:1px solid rgba({{ tema['vivo-rgb'] }}, 0.35);border-radius:24px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

        <tr><td align="center" style="padding:24px 24px 0;">
          <img src="cid:personaje" width="140" alt="{{ personaje['nombre'] }}" style="display:block;width:140px;max-width:100%;height:auto;border:0;">
        </td></tr>

        <tr><td align="center" style="padding:8px 28px 0;font-family:Georgia,'Times New Roman',serif;">
          <h1 style="margin:0;font-size:26px;font-style:italic;font-weight:700;color:{{ tema['vivo'] }};">Tu resumen de {{ resumen.mes }}</h1>
          <p style="margin:6px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:rgba(255,255,255,0.55);">¡Hola, {{ user.nameUser }}! Así te fue este mes.</p>
        </td></tr>

        <tr><td align="center" style="padding:18px 28px 0;font-family:Arial,Helvetica,sans-serif;">
          <div style="font-size:46px;font-weight:700;color:#ffffff;">{{ resumen.promedio }}%</div>
          <div style="font-size:13px;color:rgba(255,255,255,0.6);">de cumplimiento general</div>
          {% if resumen.diferencia is not none %}
          <div style="margin-top:4px;font-size:12px;color:rgba(255,255,255,0.5);">
            {% if resumen.diferencia == 0 %}Igual que en {{ resumen.mes_comparado }}{% else %}{{ '%+d' % resumen.diferencia }} puntos frente a {{ resumen.mes_comparado }}{% endif %}
          </div>
          {% endif %}
        </td></tr>

        <tr><td style="padding:18px 28px 0;font-family:Arial,Helvetica,sans-serif;">
          <p style="margin:0 0 8px;padding:12px 14px;border-radius:12px;background:rgba(0,230,118,0.1);border-left:4px solid #00e676;font-size:15px;color:#ffffff;">
            <span style="font-size:12px;color:rgba(255,255,255,0.55);">🏆 Tu mejor hábito</span><br>
            <strong>{{ resumen.mejor.nombre }}</strong> · {{ resumen.mejor.pct }}% ({{ resumen.mejor.cumplidos }} de {{ resumen.mejor.programados }} días)
          </p>
          {% if resumen.peor %}
          <p style="margin:0;padding:12px 14px;border-radius:12px;background:rgba(255,102,102,0.1);border-left:4px solid #ff6666;font-size:15px;color:#ffffff;">
            <span style="font-size:12px;color:rgba(255,255,255,0.55);">⚡ El que más te costó</span><br>
            <strong>{{ resumen.peor.nombre }}</strong> · {{ resumen.peor.pct }}% ({{ resumen.peor.cumplidos }} de {{ resumen.peor.programados }} días)
          </p>
          {% endif %}
        </td></tr>

        <tr><td style="padding:16px 28px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.8;color:rgba(255,255,255,0.8);">
          ✅ <strong>{{ resumen.total_cumplidos }}</strong> veces cumpliste<br>
          📅 <strong>{{ resumen.dias_activos }} de {{ resumen.dias_del_mes }}</strong> días activos<br>
          ⭐ <strong>{{ resumen.dias_perfectos }}</strong> días perfectos<br>
          🔥 <strong>{{ resumen.mejor_racha }}</strong> días de mejor racha
          {% if resumen.mejor_dia %}<br>🌟 Tu mejor día: <strong>{{ resumen.mejor_dia }}</strong>{% endif %}
        </td></tr>

        <tr><td style="padding:18px 28px 0;font-family:Arial,Helvetica,sans-serif;">
          <p style="margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.5);">Todos tus hábitos</p>
          {% for h in resumen.habitos %}
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:10px;">
            <tr>
              <td style="font-size:14px;color:#ffffff;">{{ h.nombre }}</td>
              <td align="right" style="font-size:14px;font-weight:700;color:#ffffff;">{{ h.pct }}%</td>
            </tr>
            <tr><td colspan="2" style="padding-top:4px;">
              <div style="height:8px;border-radius:4px;background:rgba(255,255,255,0.1);">
                <div style="width:{{ h.pct }}%;height:8px;border-radius:4px;background:{{ colores[h.nivel] }};"></div>
              </div>
            </td></tr>
          </table>
          {% endfor %}
        </td></tr>

        {% if url_estadisticas %}
        <tr><td align="center" style="padding:12px 28px 24px;">
          <a href="{{ url_estadisticas }}" style="display:inline-block;padding:14px 30px;border-radius:14px;background:{{ tema['grad-1'] }};background-image:linear-gradient(135deg, {{ tema['grad-1'] }}, {{ tema['vivo'] }});font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;color:#ffffff;text-decoration:none;">
            Ver más estadísticas →
          </a>
        </td></tr>
        {% endif %}
      </table>
    </td></tr>

    <tr><td align="center" style="padding:18px 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:rgba(255,255,255,0.4);">
      Recibes este correo porque tienes un recordatorio activo. Sale una vez, al empezar cada mes.
    </td></tr>
  </table>

</td></tr>
</table>
</body>
</html>
