<!-- Modal: Agregar Vocabulario -->
<div class="modal fade" id="vocabAddModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg glass-modal">
            <div class="modal-header glass-header">
                <h5 class="modal-title d-flex align-items-center fw-bold">
                    <div class="icon-box"><i class="bi bi-plus-circle text-vocab-accent"></i></div>
                    Agregar Vocabulario
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form method="POST" action="{{ url_for(sec.bp_vocab ~ '.index') }}">
                    <div class="mb-3">
                        <label class="form-label text-white-50" for="vocabAddNombre">Nombre</label>
                        <div class="vocab-autocompletar-fila">
                            <input type="text" name="nombre" id="vocabAddNombre" class="form-control glass-input" placeholder="Ej: {{ sec.ejemplo_nombre }}" required maxlength="60">
                            {# Autocompletar solo existe en Inglés (traduce desde inglés) #}
                            {% if sec.autocompletar %}<button type="button" id="vocabAutocompletarBtn" class="vocab-autocompletar-btn"
                                    title="Autocompletar significado y ejemplo" aria-label="Autocompletar significado y ejemplo">
                                <i class="bi bi-search"></i>
                            </button>{% endif %}
                        </div>
                        <p class="vocab-autocompletar-estado" id="vocabAutocompletarEstado" hidden></p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white-50">Significado</label>
                        <input type="text" name="significado" id="vocabAddSignificado" class="form-control glass-input" placeholder="Ej: {{ sec.ejemplo_significado }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-white-50">Ejemplos</label>
                        <textarea name="ejemplos" id="vocabAddEjemplos" class="form-control glass-input" rows="3" placeholder="Ej: {{ sec.ejemplo_frase }}"></textarea>
                    </div>
                    <button type="submit" class="btn w-100 btn-vocab-accent fw-bold">Guardar Palabra</button>
                </form>
            </div>
        </div>
    </div>
</div>
