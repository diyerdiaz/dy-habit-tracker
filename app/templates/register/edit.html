<!-- Modal: Editar Hábito -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg glass-modal">
            <div class="modal-header glass-header">
                <h5 class="modal-title d-flex align-items-center fw-bold">
                    <div class="icon-box"><i class="bi bi-pencil text-warning"></i></div>
                    Editar Hábito
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="editForm" method="POST" action="">
                    <div class="mb-3">
                        <label class="form-label text-white-50">Nombre del Hábito</label>
                        <input type="text" name="habitName" id="editName" class="form-control glass-input" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white-50">Descripción o Meta</label>
                        <input type="text" name="habitDesc" id="editDesc" class="form-control glass-input">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white-50">Frecuencia</label>
                        <select name="habitFreq" id="editFreq" class="form-select glass-input">
                            <option value="diario" style="background: #250035;">Diario</option>
                            <option value="semanal" style="background: #250035;">Semanal</option>
                            <option value="mensual" style="background: #250035;">Mensual</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-white-50">Categoría</label>
                        <select name="habitCategory" id="editCategory" class="form-select glass-input">
                            <option value="salud" style="background: #250035;">Salud y Deporte</option>
                            <option value="mente" style="background: #250035;">Mente y Educación</option>
                            <option value="finanzas" style="background: #250035;">Finanzas</option>
                            <option value="espiritual" style="background: #250035;">Espiritual / Social</option>
                        </select>
                    </div>
                    <button type="submit" class="btn w-100 btn-purple fw-bold">Actualizar Hábito</button>
                </form>
            </div>
        </div>
    </div>
</div>
