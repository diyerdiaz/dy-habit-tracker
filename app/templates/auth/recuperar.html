{% extends "auth/_recuperar_layout.html" %}

{% block titulo_pagina %}Recuperar contraseña{% endblock %}

{% block tarjeta %}
<div class="card-header">
    <span class="icono-loto login-card-loto" aria-hidden="true"></span>
    <h1>Recuperar contraseña</h1>
    <p class="login-subtitulo">Paso 1 de 3 · ¿Quién eres?</p>
</div>
<div class="card-body">
    <form method="post" action="{{ url_for('recuperar.inicio') }}">
        <div class="form-group login-campo">
            <label for="identificador" class="form-label">Usuario o correo electrónico</label>
            <div class="login-campo-control">
                <i class="bi bi-person-fill login-campo-icono" aria-hidden="true"></i>
                <input type="text" name="identificador" id="identificador" class="form-control"
                placeholder="Tu usuario o tu correo" value="{{ identificador }}"
                autocomplete="username" maxlength="120" required autofocus>
            </div>
            <p class="recuperar-ayuda">Te enviaremos un código de 6 dígitos al correo que registraste en tu perfil.</p>
        </div>
        <button type="submit" class="btn btn-primary btn-block w-100">
            <i class="bi bi-envelope-arrow-up"></i> Enviarme el código
        </button>
        <div class="login-separador"><span>o</span></div>
        <a href="{{ url_for('auth.login') }}" class="btn login-btn-secundario w-100 d-flex align-items-center justify-content-center">
            <i class="bi bi-arrow-left"></i> Volver a Iniciar Sesión
        </a>
    </form>
</div>
{% endblock %}
