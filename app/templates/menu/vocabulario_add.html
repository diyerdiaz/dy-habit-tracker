<!-- Modal: Agregar Vocabulario -->
<div class="modal fade" id="vocabAddModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg glass-modal">
            <div class="modal-header glass-header">
                <h5 class="modal-title d-flex align-items-center fw-bold">
                    <div class="icon-box"><i class="bi bi-plus-circle text-vocab-accent"></i></div>
                    Agregar Vocabulario
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form method="POST" action="{{ url_for('menu.vocabulario') }}">
                    <div class="mb-3">
                        <label class="form-label text-white-50">Nombre</label>
                        <input type="text" name="nombre" class="form-control glass-input" placeholder="Ej: Apple" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white-50">Significado</label>
                        <input type="text" name="significado" class="form-control glass-input" placeholder="Ej: Manzana" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-white-50">Ejemplos</label>
                        <textarea name="ejemplos" class="form-control glass-input" rows="3" placeholder="Ej: I eat an apple every day."></textarea>
                    </div>
                    <button type="submit" class="btn w-100 btn-vocab-accent fw-bold">Guardar Palabra</button>
                </form>
            </div>
        </div>
    </div>
</div>
