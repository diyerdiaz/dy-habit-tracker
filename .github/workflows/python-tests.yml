# Corre todos los tests en GitHub cada vez que se sube código o se abre un Pull Request.
# Si algún test falla, GitHub lo marca con una ✗ roja y no conviene hacer merge.
name: Tests

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Igual que en el Dockerfile: las fechas (rachas, recordatorios) son de Colombia
      TZ: America/Bogota

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          # La misma versión que usa el Dockerfile en producción
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Correr los tests
        run: python -m pytest app/test -q
